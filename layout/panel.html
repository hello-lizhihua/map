<!DOCTYPE html>
<!-- 地球场景布局设计稿 · 零依赖 · file:// 双击直接打开 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球场景布局 · 国别面板设计稿</title>
<style>
:root{
  --ink:#f0ede6;
  --amber:#ffcc33;
  --panel:rgba(13,15,20,.82);
  --ctrl:rgba(20,22,28,.62);
  --pop:rgba(20,22,28,.78);
  --line:rgba(240,237,230,.12);
  --ink-dim:rgba(240,237,230,.55);
  --ink-faint:rgba(240,237,230,.42);
  --r6:6px;
  --r14:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#14161a}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:26px 16px 44px;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0}
input{font-family:inherit}
.hide{display:none!important}

/* ===== 页面说明头 ===== */
.page-head{text-align:center;margin-bottom:18px}
.page-head h1{font-size:17px;font-weight:600;letter-spacing:.5px}
.page-head p{margin-top:6px;font-size:12.5px;color:var(--ink-dim);letter-spacing:.3px}

/* ===== 1600x900 场景画布（自适应缩放：窗口小于画布时整体等比缩小，保持设计坐标） ===== */
.canvas{
  position:relative;flex:none;width:1600px;height:900px;overflow:hidden;
  border-radius:var(--r14);
  background:linear-gradient(135deg,#ece7dd,#e2dccd);
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  transform-origin:top center;
}
.earth{
  position:absolute;left:-690px;top:210px;width:1500px;height:1500px;border-radius:50%;
  background:#dfe7ea;border:2px solid #d8d2c2;
}
.hint{
  position:absolute;left:24px;bottom:18px;font-size:12px;letter-spacing:.5px;
  color:rgba(38,41,48,.8);user-select:none;
  text-shadow:0 1px 0 rgba(255,255,255,.75),0 0 6px rgba(255,255,255,.35);
}

/* ===== 右上角控制排（y=40 中线） ===== */
.cbtn{
  position:absolute;top:24px;width:32px;height:32px;border-radius:50%;
  background:var(--ctrl);display:grid;place-items:center;transition:background .15s;
}
.cbtn:hover{background:rgba(20,22,28,.78)}
.cbtn:active{transform:scale(.95)}
#gearBtn{left:24px}    /* 设置齿轮中心距左 40 */
.zoom{
  position:absolute;top:20px;left:72px;height:40px;   /* 胶囊左缘距左 72（齿轮命中区右缘 64 + 间隙 8） */
  display:flex;align-items:center;gap:6px;padding:0 7px;
  background:var(--ctrl);border-radius:20px;user-select:none;
}
.zbtn{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:rgba(255,255,255,.09);color:var(--ink);font-size:14px;line-height:1;
  display:grid;place-items:center;transition:background .15s;
}
.zbtn:hover{background:rgba(255,255,255,.18)}
.zbtn:active{transform:scale(.94)}
.ztrack{position:relative;width:88px;height:26px;cursor:pointer}
.zticks{position:absolute;inset:0}
.ztick{position:absolute;top:9px;width:1px;height:8px;background:rgba(240,237,230,.32)}
.ztick.on{background:var(--amber)}
.zthumb{
  position:absolute;top:13px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:var(--amber);transition:left .15s;pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,204,51,.22),0 1px 4px rgba(0,0,0,.35);
}

/* ===== 设置面板 ===== */
.settings{
  position:absolute;top:76px;left:24px;width:148px;z-index:40;
  background:var(--panel);border:1px solid rgba(240,237,230,.10);border-radius:var(--r14);
  padding:5px 0;box-shadow:0 14px 36px rgba(0,0,0,.28);
}
.set-row{
  height:38px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;font-size:13px;color:rgba(240,237,230,.88);
}
.mrow{cursor:pointer;transition:background .12s}
.mrow:hover{background:rgba(255,255,255,.06)}
.mrow.sel{color:var(--amber)}
.mdot{width:6px;height:6px;border-radius:50%;background:var(--amber);visibility:hidden;flex:none}
.mrow.sel .mdot{visibility:visible}
.sep{height:1px;background:rgba(240,237,230,.10);margin:2px 8px}
.switch{
  position:relative;flex:none;width:36px;height:20px;border-radius:10px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  transition:background .15s,border-color .15s;
}
.switch .knob{
  position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#f0ede6;transition:left .15s,background .15s;
}
.switch.on{background:var(--amber);border-color:var(--amber)}
.switch.on .knob{left:18px;background:#17191f}

/* ===== 右侧国家面板（宽 300，右缘距右 12，上 84 下 20） ===== */
.cpanel{transition:transform .28s ease, opacity .28s ease;
  position:absolute;top:20px;right:12px;bottom:20px;width:300px;z-index:10;
  display:flex;flex-direction:column;
  background:var(--panel);border-radius:var(--r14);
  box-shadow:0 18px 48px rgba(0,0,0,.30);
}
.cpanel::before{ /* 左缘 1px 分隔线 */
  content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;
  background:rgba(240,237,230,.16);
}
.cpanel.collapsed{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.cexpand{
  position:absolute;top:20px;right:12px;width:24px;height:64px;
  border-radius:var(--r6);background:rgba(13,15,20,.82);border:1px solid rgba(240,237,230,.14);
  color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;
}
.cexpand:hover{background:rgba(20,22,28,.92)}
.chead{height:44px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid rgba(240,237,230,.08)}
.ctitle{font-size:15px;font-weight:600}
.ccount{margin-left:8px;font-size:12px;color:var(--ink-faint)}
.ccollapse{
  margin-left:auto;width:24px;height:24px;border-radius:var(--r6);
  font-size:14px;color:rgba(240,237,230,.6);display:grid;place-items:center;transition:background .12s,color .12s;
}
.ccollapse:hover{background:rgba(255,255,255,.10);color:var(--ink)}

/* 页签条（高 32） */
.tabs{padding:0 8px;height:32px;flex:none;display:flex;align-items:stretch;padding:0 8px;border-bottom:1px solid rgba(240,237,230,.08)}
.tab{position:relative;padding:0 12px;font-size:13px;color:rgba(240,237,230,.5);transition:color .12s}
.tab:hover{color:rgba(240,237,230,.75)}
.tab.active{color:var(--ink)}
.tab.active::after{
  content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
  background:var(--amber);border-radius:1px;
}

/* 选中页签内容 */
.pane{padding:4px 8px 8px;padding:10px 8px 8px;flex:none}
.prow{margin-bottom:8px}
.prow:last-child{margin-bottom:0}
.chips{display:flex;gap:5px}
.chip{
  flex:1;height:26px;border-radius:var(--r6);
  background:rgba(255,255,255,.08);font-size:12px;color:rgba(240,237,230,.75);
  display:grid;place-items:center;transition:background .12s,color .12s;
}
.chip:hover{background:rgba(255,255,255,.14)}
.chip.active{background:var(--amber);color:#17191f;font-weight:600}
.filters{display:flex;gap:6px}
.frow{display:flex;gap:8px;align-items:center}
.flabel{flex:none;width:32px;font-size:12.5px;color:var(--ink-dim)}
.dd{position:relative;flex:1;min-width:0}
.ddbox{
  width:100%;height:30px;border-radius:var(--r6);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  display:flex;align-items:center;gap:6px;padding:0 8px;
  font-size:12px;color:var(--ink-faint);transition:border-color .12s;
}
.ddbox:hover{border-color:rgba(255,255,255,.26)}
.dd.open .ddbox{border-color:rgba(255,204,51,.55)}
.dd.has .ddbox{color:var(--ink)}
.ddlabel{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddclear{display:none;flex:none;width:16px;height:16px;line-height:14px;text-align:center;border-radius:50%;
  color:rgba(240,237,230,.6);font-size:12px;margin-right:2px}
.ddclear:hover{background:rgba(240,237,230,.18);color:var(--ink)}
.dd.has .ddclear{display:block}
.caret{font-size:9px;color:rgba(240,237,230,.5);transition:transform .15s;flex:none}
.dd.open .caret{transform:rotate(180deg)}
.ddpop{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
  background:var(--pop);border:1px solid var(--line);border-radius:var(--r6);padding:4px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);display:none;
}
.dd.open .ddpop{display:block}
.ditem{
  height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:4px;
  font-size:12.5px;color:rgba(240,237,230,.72);cursor:pointer;transition:background .1s;
}
.ditem:hover{background:rgba(255,255,255,.07)}
.ditem .tick{width:14px;flex:none;font-size:11px;color:var(--amber);visibility:hidden}
.ditem.on{background:rgba(255,255,255,.09);color:var(--ink)}
.ditem.on .tick{visibility:visible}
.sorter{display:flex;align-items:center;gap:8px}
.sortlabel{font-size:12.5px;color:var(--ink-dim);flex:none;user-select:none}
.sorter .chips{flex:1}
.search input{
  width:100%;height:30px;border-radius:var(--r6);outline:none;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  padding:0 10px;font-size:12.5px;color:var(--ink);transition:border-color .12s;
}
.search input::placeholder{color:rgba(240,237,230,.35)}
.search input:focus{border-color:rgba(255,204,51,.55)}

/* 国家页签：手风琴列表 */
.cworld{display:flex;flex-direction:column;flex:1;min-height:0;padding:4px 8px 8px}
.clist{flex:1;min-height:0;overflow-y:auto;padding-bottom:6px}
.clist::-webkit-scrollbar{width:8px}
.clist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.clist::-webkit-scrollbar-track{background:transparent}
.ghead{
  position:relative;height:32px;flex:none;display:flex;align-items:center;padding:0 10px;
  background:rgba(255,255,255,.055);font-size:13px;font-weight:600;color:var(--ink);
  cursor:pointer;user-select:none;transition:background .12s;
}
.ghead:hover{background:rgba(255,255,255,.09)}
.ghead::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);opacity:0}
.ghead.exp::before{opacity:1}
.gcount{margin-left:auto;font-size:11px;font-weight:400;color:var(--ink-faint)}
.garrow{margin-left:8px;width:10px;text-align:center;font-size:10px;color:rgba(240,237,230,.6);flex:none}
.crow{position:relative;cursor:pointer;transition:background .12s}
.crmain{height:38px;display:flex;align-items:center;padding:0 10px 0 12px}
.crow:not(.sel):hover{background:rgba(255,255,255,.10)}
.crow.sel{background:rgba(255,255,255,.22)}
.crow.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.ccode{width:46px;flex:none;font-size:12px;color:var(--ink-faint)}
.cname{flex:1;min-width:0;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpop{flex:none;margin-left:8px;font-size:13px;color:var(--ink-faint)}
.cdetail{padding:0 10px 10px 58px;font-size:12px;line-height:19px;color:rgba(240,237,230,.62)}
.cempty{padding:24px 0;text-align:center;font-size:12.5px;color:var(--ink-faint)}
</style>
</head>
<body>

<header class="page-head">
  <h1>地球场景布局 · 国别面板设计稿</h1>
  <p>此页为布局设计稿，审核通过后落 Godot 实现 · <span id="fitInfo"></span></p>
</header>

<div class="canvas" id="canvas">
  <!-- 地球示意（左下 1/2 出画） -->
  <div class="earth"></div>
  <div class="hint">拖动旋转 · 滑块缩放</div>

  <!-- 缩放滑块 -->
  <div class="zoom">
    <button class="zbtn" id="zoomOut" type="button" aria-label="缩小">−</button>
    <div class="ztrack" id="ztrack">
      <div class="zticks" id="zticks"></div>
      <div class="zthumb" id="zthumb"></div>
    </div>
    <button class="zbtn" id="zoomIn" type="button" aria-label="放大">＋</button>
  </div>

  <!-- 返回按钮（真实场景共享组件，回场景选择界面） -->
    <!-- 设置齿轮 -->
  <button class="cbtn" id="gearBtn" type="button" title="设置" aria-label="设置">
    <svg width="20" height="20" viewBox="0 0 32 32" fill="none" stroke="#f0ede6" stroke-width="1.6" stroke-linecap="round" opacity=".92">
      <circle cx="16" cy="16" r="7"/>
      <circle cx="16" cy="16" r="2.6"/>
      <path d="M25.6 16 L29 16"/><path d="M22.8 22.8 L25.2 25.2"/><path d="M16 25.6 L16 29"/><path d="M9.2 22.8 L6.8 25.2"/>
      <path d="M6.4 16 L3 16"/><path d="M9.2 9.2 L6.8 6.8"/><path d="M16 6.4 L16 3"/><path d="M22.8 9.2 L25.2 6.8"/>
    </svg>
  </button>

  <!-- 设置面板 -->
  <div class="settings hide" id="settings">
    <div class="set-row back" id="backRow"><span>‹ 返回场景选择</span></div>
    <div class="sep"></div>
    <div class="set-row"><span>全屏</span><button class="switch" id="fsSwitch" type="button" aria-label="全屏开关"><span class="knob"></span></button></div>
    <div class="sep"></div>
    <div id="mapTypes"></div>
  </div>

  <!-- 面板收起后的展开把手（默认隐藏） -->
  <button class="cexpand hide" id="cexpand" type="button" aria-label="展开面板">›</button>

  <!-- 国家面板 -->
  <aside class="cpanel">
    <div class="chead">
      <button class="ccollapse" type="button" aria-label="收起面板">‹</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="countries" type="button">国家(242)</button>
      <button class="tab" data-tab="selected" type="button">选中</button>
    </div>

    <!-- 选中页签：大洲 / 组织两个多选维度下拉 -->
    <div class="pane hide" id="paneSelected">
      <div class="prow frow"><span class="flabel">大洲</span>
        <div class="dd" id="ddCont" data-ph="全部">
          <button class="ddbox" type="button"><span class="ddlabel">全部</span><span class="ddclear" title="清空多选">×</span><span class="caret">▾</span></button>
          <div class="ddpop"></div>
        </div>
      </div>
      <div class="prow frow"><span class="flabel">组织</span>
        <div class="dd" id="ddOrg" data-ph="组织">
          <button class="ddbox" type="button"><span class="ddlabel">组织</span><span class="ddclear" title="清空多选">×</span><span class="caret">▾</span></button>
          <div class="ddpop"></div>
        </div>
      </div>
    </div>

    <!-- 国家页签：筛选（大洲/组织）+ 排序 + 搜索 + 手风琴列表 -->
    <div class="cworld" id="paneCountries">
      <div class="prow sorter">
        <span class="sortlabel">排序</span>
        <div class="chips" id="sortChips"></div>
      </div>
      <div class="prow search">
        <input id="search" type="text" placeholder="搜索国家：CN / 中国" autocomplete="off" spellcheck="false">
      </div>
      <div class="clist" id="clist"></div>
    </div>
  </aside>
</div>

var state = {
  tab:'countries', conts:new Set(['全部']), orgs:new Set(),
  sort:'area', q:'', open:new Set(['亚洲']), sel:'CN',
  mapType:0, fs:false, zoom:5, settings:false
};

function fmtPop(w){ return w >= 10000 ? (w/10000).toFixed(1) + '亿' : w + '万'; }
function fmtArea(a){
  if(a >= 1){ var v = Math.round(a*10)/10; return v + '万 km²'; }
  return Math.round(a*10000) + ' km²';
}
function idOf(d){ return d.code || ('#' + d.name); }

function cmpCode(a, b){
  var ka = a.code || '\uffff' + a.name, kb = b.code || '\uffff' + b.name;
  return ka < kb ? -1 : (ka > kb ? 1 : 0);
}
function sortRows(rows){
  var arr = rows.slice();
  if(state.q.trim()){ arr.sort(cmpCode); }  // 搜索激活：按二字码排序（同前缀国家相邻，如 CN 系）
  else if(state.sort === 'name'){ arr.sort(cmpCode); }
  else if(state.sort === 'pop'){ arr.sort(function(a,b){ return b.pop - a.pop || cmpCode(a,b); }); }
  else { arr.sort(function(a,b){ return b.area - a.area || cmpCode(a,b); }); }
  return arr;
}

/* ===== 国家页签：手风琴列表渲染 ===== */
function renderList(){
  var root = $('#clist');
  root.innerHTML = '';
  var q = state.q.trim().toLowerCase();
  var contFilter = state.conts.has('全部') || state.conts.size === 0 ? null : state.conts;  // 「全部」= 全球，不筛选
  var total = 0;
  for(var gi = 0; gi < GROUPS.length; gi++){
    var g = GROUPS[gi];
    if(contFilter && !contFilter.has(g)){ continue; }
    var all = DATA.filter(function(d){ return d.cont === g; });
    var rows = sortRows(all);
    if(q){
      rows = rows.filter(function(d){
        return d.name.toLowerCase().indexOf(q) !== -1 || d.code.toLowerCase().indexOf(q) !== -1;
      });
    }
    if(!rows.length){ continue; }
    var coded = q ? rows.length : all.filter(function(d){ return /^[A-Z]{2}$/.test(d.code); }).length;
    total += rows.length;
    var exp = q ? true : state.open.has(g);
    var gh = document.createElement('div');
    gh.className = 'ghead' + (exp ? ' exp' : '');
    gh.dataset.g = g;
    gh.innerHTML = '<span class="gtitle">' + g + '</span>'
      + '<span class="gcount">' + coded + ' 国</span>'
      + '<span class="garrow">' + (exp ? '▾' : '▸') + '</span>';
    root.appendChild(gh);
    if(!exp){ continue; }
    for(var ri = 0; ri < rows.length; ri++){
      var d = rows[ri];
      var sel = state.sel === idOf(d);
      var row = document.createElement('div');
      row.className = 'crow' + (sel ? ' sel' : '');
      row.dataset.id = idOf(d);
      var html = '<div class="crmain"><span class="ccode">' + d.code + '</span>'
        + '<span class="cname">' + d.name + '</span>'
        + '<span class="cpop">' + fmtPop(d.pop) + '</span></div>';
      if(sel){
        html += '<div class="cdetail">'
          + '<div>大小 ' + fmtArea(d.area) + ' · 人口 ' + fmtPop(d.pop) + '</div>'
          + '<div>位置 ' + d.lat + ' / ' + d.lon + ' · ' + d.cont + '</div></div>';
      }
      row.innerHTML = html;
      root.appendChild(row);
    }
  }
  if(!total){
    var e = document.createElement('div');
    e.className = 'cempty';
    e.textContent = '无匹配国家';
    root.appendChild(e);
  }
}

$('#clist').addEventListener('click', function(ev){
  var gh = ev.target.closest('.ghead');
  if(gh){
    var g = gh.dataset.g;
    if(state.open.has(g)){ state.open.delete(g); } else { state.open.add(g); }
    renderList();
    return;
  }
  var cr = ev.target.closest('.crow');
  if(cr){
    var id = cr.dataset.id;
    state.sel = (state.sel === id) ? null : id;
    renderList();
  }
});

/* ===== 通用单选 chips（机位 / 排序） ===== */
function buildChips(el, items, getFn, setFn){
  function paint(){
    var kids = el.children;
    for(var i = 0; i < kids.length; i++){
      kids[i].classList.toggle('active', kids[i].dataset.v === getFn());
    }
  }
  items.forEach(function(it){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = it[1];
    b.dataset.v = it[0];
    b.addEventListener('click', function(){ setFn(it[0]); paint(); });
    el.appendChild(b);
  });
  paint();
}
buildChips($('#sortChips'), SORT_ITEMS,
  function(){ return state.sort; }, function(v){ state.sort = v; renderList(); });

function buildDd(rootSel, items, setRef){
  var withAll = rootSel === '#ddCont';  // 大洲下拉首项「全部」：代替全球视角，与其他项互斥

    all.innerHTML = '<span class="tick">✓</span><span>全部</span>';
    all.addEventListener('click', function(){
      if(!(setRef.has('全部') && setRef.size === 1)){ setRef.clear(); setRef.add('全部'); paint(); }
    });
    pop.appendChild(all);
  }
  items.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'ditem';
    d.dataset.v = it;
    d.innerHTML = '<span class="tick">✓</span><span>' + it + '</span>';
    d.addEventListener('click', function(){
      if(withAll && it === '全部'){
        if(!(setRef.has('全部') && setRef.size === 1)){ setRef.clear(); setRef.add('全部'); }
      } else if(withAll && setRef.has('全部')){
        setRef.clear(); setRef.add(it);
      } else if(setRef.has(it)){ setRef.delete(it); } else { setRef.add(it); }
      paint();
    });
    pop.appendChild(d);
  });
  var clearBtn = root.querySelector('.ddclear');
  clearBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(withAll){ setRef.clear(); setRef.add('全部'); }
    else { setRef.clear(); }
    paint();
  });
  root.querySelector('.ddbox').addEventListener('click', function(){
    var was = root.classList.contains('open');
    closeAllDd();
    if(!was){ root.classList.add('open'); }
  });
  function paint(){
    var sel = items.filter(function(x){ return setRef.has(x); });
    if(withAll && setRef.has('全部')){ sel = ['全部']; }
    if(sel.length === 0){ label.textContent = root.dataset.ph; }
    else if(sel.length === 1){ label.textContent = sel[0]; }
    else { label.textContent = sel[0] + ' 等 ' + sel.length + ' 项'; }
    var hasSel = withAll ? !(setRef.size === 1 && setRef.has('全部')) && setRef.size > 0 : sel.length > 0;
    root.classList.toggle('has', hasSel);
    var kids = pop.children;
    for(var i = 0; i < kids.length; i++){
      kids[i].classList.toggle('on', setRef.has(kids[i].dataset.v));
    }
  }
  paint();
}
buildDd('#ddCont', CONT_ITEMS, state.conts);
buildDd('#ddOrg', ORG_ITEMS, state.orgs);

/* ===== 页签切换 ===== */
var tabs = document.querySelectorAll('.tab');
for(var ti = 0; ti < tabs.length; ti++){
  tabs[ti].addEventListener('click', function(){
    state.tab = this.dataset.tab;
    for(var i = 0; i < tabs.length; i++){ tabs[i].classList.toggle('active', tabs[i] === this); }
    $('#paneSelected').classList.toggle('hide', state.tab !== 'selected');
    $('#paneCountries').classList.toggle('hide', state.tab !== 'countries');
  });
}

/* ===== 设置面板开合 + 全屏联动 ===== */
var settingsEl = $('#settings'), gearBtn = $('#gearBtn');
/* 面板收起 / 展开（动画：滑出右侧，收起后仅剩右缘把手按钮） */
var cpanelEl = $('.cpanel'), cexpandEl = $('#cexpand');
function setCollapsed(v){
  state.collapsed = v;
  cpanelEl.classList.toggle('collapsed', v);
  cexpandEl.classList.toggle('hide', !v);
}
var ccBtn = document.querySelector('.ccollapse');
if(ccBtn){ ccBtn.addEventListener('click', function(){ setCollapsed(true); }); }
cexpandEl.addEventListener('click', function(){ setCollapsed(false); });
function setSettings(v){ state.settings = v; settingsEl.classList.toggle('hide', !v); }
gearBtn.addEventListener('click', function(){ setSettings(!state.settings); });
$('#backRow').addEventListener('click', function(){ setSettings(false); });

function setFs(v){
  state.fs = v;
  $('#fsSwitch').classList.toggle('on', v);
}
$('#fsSwitch').addEventListener('click', function(){ setFs(!state.fs); });

/* ===== 地图类型单选 ===== */
var mtWrap = $('#mapTypes');
MAP_ITEMS.forEach(function(m, i){
  var r = document.createElement('div');
  r.className = 'set-row mrow';
  r.innerHTML = '<span>' + m + '</span><span class="mdot"></span>';
  r.addEventListener('click', function(){ state.mapType = i; paintMt(); });
  mtWrap.appendChild(r);
});
function paintMt(){
  var kids = mtWrap.children;
  for(var i = 0; i < kids.length; i++){ kids[i].classList.toggle('sel', i === state.mapType); }
}
paintMt();

/* ===== 搜索过滤（实时作用于「国家」页签列表） ===== */
$('#search').addEventListener('input', function(e){
  state.q = e.target.value;
  renderList();
});

/* ===== 缩放滑块（10 刻度，点轨道 / ± 步进） ===== */
var ztrack = $('#ztrack'), zthumb = $('#zthumb'), ticksWrap = $('#zticks');
var T0 = 4, T1 = 84, TSTEP = (T1 - T0) / 9;
for(var i = 0; i < 10; i++){
  var s = document.createElement('span');
  s.className = 'ztick';
  s.style.left = (T0 + i * TSTEP - 0.5) + 'px';
  ticksWrap.appendChild(s);
}
function setZoom(v){
  state.zoom = Math.max(0, Math.min(9, v));
  zthumb.style.left = (T0 + state.zoom * TSTEP) + 'px';
  var kids = ticksWrap.children;
  for(var k = 0; k < kids.length; k++){ kids[k].classList.toggle('on', k <= state.zoom); }
}
ztrack.addEventListener('click', function(e){
  var r = ztrack.getBoundingClientRect();
  setZoom(Math.round((e.clientX - r.left - T0) / TSTEP));
});
$('#zoomOut').addEventListener('click', function(){ setZoom(state.zoom - 1); });
$('#zoomIn').addEventListener('click', function(){ setZoom(state.zoom + 1); });
setZoom(state.zoom);

/* ===== 点面板外收起（设置面板 / 下拉） ===== */
document.addEventListener('click', function(e){
  var t = e.target;
  if(state.settings && !settingsEl.contains(t) && !gearBtn.contains(t)){ setSettings(false); }
  if(!t.closest('.dd')){ closeAllDd(); }
});

/* 初始渲染 */
renderList();

/* 画布自适应：窗口小于 1600×900 时整体等比缩小（设计坐标不变，右侧面板始终完整可见） */
  (function () {
    var canvasEl = document.getElementById('canvas');
    var info = document.getElementById('fitInfo');
    var DESIGN_W = 1600, DESIGN_H = 900, HEAD = 110, MARGIN = 32;
    function fit() {
      var aw = window.innerWidth - MARGIN;
      var ah = window.innerHeight - HEAD - MARGIN;
      var scale = Math.min(1, aw / DESIGN_W, ah / DESIGN_H);
      if (scale < 1) {
        canvasEl.style.transform = 'scale(' + scale + ')';
        canvasEl.style.marginBottom = (-(DESIGN_H * (1 - scale))) + 'px';
        document.body.style.overflowX = 'hidden';
        info.textContent = '已缩放 ' + Math.round(scale * 100) + '%（设计稿 1600×900）';
      } else {
        canvasEl.style.transform = '';
        canvasEl.style.marginBottom = '';
        document.body.style.overflowX = '';
        info.textContent = '原始尺寸 1600×900';
      }
    }
    window.addEventListener('resize', fit);
    fit();
  })();
})();
</script>
</body>
